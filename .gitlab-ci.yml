# GitLab CI for lend-site-v2 (multi-tenant deploy)
#
# Secrets and per-environment URLs live in GitLab CI/CD variables
# (lendtech group: LEND_* / ALLOWED_ORIGINS; project: Sentry / TCI).
# Job YAML only maps them into the Next.js build-args.
#
# Keep old behavior:
#   - main => default lend site deployment
# Add tag-triggered prod tenants:
#   - lend360-vX.Y.Z
#   - lend365-vX.Y.Z (manual approval)
#   - karalend-vX.Y.Z (karalend runner, docker compose)
#   - all-vX.Y.Z, all-lend365-vX.Y.Z
# lianlend (mylianpay) and toplend are commented out for now.

stages:
  - deploy

default:
  interruptible: true
  tags:
    - shell

variables:
  CONTAINER_PORT: "3000"

.deploy_template: &deploy_template
  stage: deploy
  script:
    - docker version
    - |
      docker build \
        --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
        --build-arg NEXT_PUBLIC_API_REPORT_URL="$NEXT_PUBLIC_API_REPORT_URL" \
        --build-arg NEXT_PUBLIC_AUTH_API_URL="$NEXT_PUBLIC_AUTH_API_URL" \
        --build-arg NEXT_PUBLIC_QUERY_GC_TIME="$NEXT_PUBLIC_QUERY_GC_TIME" \
        --build-arg NEXT_PUBLIC_QUERY_STALE_TIME="$NEXT_PUBLIC_QUERY_STALE_TIME" \
        --build-arg NEXT_PUBLIC_QUERY_RETRY="$NEXT_PUBLIC_QUERY_RETRY" \
        --build-arg NEXT_PUBLIC_SENTRY_DSN="$NEXT_PUBLIC_SENTRY_DSN" \
        --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT="$NEXT_PUBLIC_SENTRY_ENVIRONMENT" \
        -t "$IMAGE_NAME:latest" \
        .
    - docker stop "$CONTAINER_NAME" || true
    - docker rm "$CONTAINER_NAME" || true
    - |
      docker run -d \
        --name "$CONTAINER_NAME" \
        --restart always \
        --add-host sentry.psaapp.ir:192.168.20.70 \
        -p "${DEPLOY_HOST_PORT}:${CONTAINER_PORT}" \
        -e NODE_ENV=production \
        -e PORT=3000 \
        -e HOSTNAME=0.0.0.0 \
        -e NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
        -e NEXT_PUBLIC_API_REPORT_URL="$NEXT_PUBLIC_API_REPORT_URL" \
        -e NEXT_PUBLIC_AUTH_API_URL="$NEXT_PUBLIC_AUTH_API_URL" \
        -e NEXT_PUBLIC_QUERY_GC_TIME="$NEXT_PUBLIC_QUERY_GC_TIME" \
        -e NEXT_PUBLIC_QUERY_STALE_TIME="$NEXT_PUBLIC_QUERY_STALE_TIME" \
        -e NEXT_PUBLIC_QUERY_RETRY="$NEXT_PUBLIC_QUERY_RETRY" \
        -e NEXT_PUBLIC_SENTRY_DSN="$NEXT_PUBLIC_SENTRY_DSN" \
        -e NEXT_PUBLIC_SENTRY_ENVIRONMENT="$NEXT_PUBLIC_SENTRY_ENVIRONMENT" \
        "$IMAGE_NAME:latest"
    - docker image prune -f
    - docker builder prune -f

# Existing default deployment (unchanged behavior)
deploy:default-main:
  <<: *deploy_template
  variables:
    IMAGE_NAME: lend-site-v2
    CONTAINER_NAME: lend-site-v2
    DEPLOY_HOST_PORT: "3000"
    NEXT_PUBLIC_API_BASE_URL: "$LEND_API_URL"
    NEXT_PUBLIC_API_REPORT_URL: "$LEND_REPORT_URL"
    NEXT_PUBLIC_AUTH_API_URL: "$LEND_AUTH_URL"
    NEXT_PUBLIC_QUERY_GC_TIME: "0"
    NEXT_PUBLIC_QUERY_STALE_TIME: "0"
    NEXT_PUBLIC_QUERY_RETRY: "1"
  environment:
    name: production
    url: https://lend.persiansys.ir
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Tag-based tenant deploys

# .deploy_tenant_rules_lianlend: &deploy_tenant_rules_lianlend
#   - if: '$CI_COMMIT_TAG =~ /^lianlend-v\d+\.\d+\.\d+$/'
#   - if: '$CI_COMMIT_TAG =~ /^all-v\d+\.\d+\.\d+$/'
#   - if: '$CI_COMMIT_TAG =~ /^all-lend365-v\d+\.\d+\.\d+$/'

.deploy_tenant_rules_lend360: &deploy_tenant_rules_lend360
  - if: '$CI_COMMIT_TAG =~ /^lend360-v\d+\.\d+\.\d+$/'
  - if: '$CI_COMMIT_TAG =~ /^all-v\d+\.\d+\.\d+$/'
  - if: '$CI_COMMIT_TAG =~ /^all-lend365-v\d+\.\d+\.\d+$/'

.deploy_tenant_rules_toplend: &deploy_tenant_rules_toplend
  - if: '$CI_COMMIT_TAG =~ /^toplend-v\d+\.\d+\.\d+$/'
  - if: '$CI_COMMIT_TAG =~ /^all-v\d+\.\d+\.\d+$/'
  - if: '$CI_COMMIT_TAG =~ /^all-lend365-v\d+\.\d+\.\d+$/'

.deploy_tenant_rules_lend365: &deploy_tenant_rules_lend365
  - if: '$CI_COMMIT_TAG =~ /^lend365-v\d+\.\d+\.\d+$/'
  - if: '$CI_COMMIT_TAG =~ /^all-v\d+\.\d+\.\d+$/'

