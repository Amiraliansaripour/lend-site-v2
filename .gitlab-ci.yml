deploy:lend360:
  <<: *deploy_template
  variables:
    IMAGE_NAME: lend-site-lend360
    CONTAINER_NAME: lend-site-lend360
    DEPLOY_HOST_PORT: "3002"
    NEXT_PUBLIC_API_BASE_URL: "$LEND_API_URL"
    NEXT_PUBLIC_API_REPORT_URL: "$LEND_REPORT_URL"
    NEXT_PUBLIC_AUTH_API_URL: "$LEND_AUTH_URL"
    NEXT_PUBLIC_QUERY_GC_TIME: "300000"
    NEXT_PUBLIC_QUERY_STALE_TIME: "60000"
    NEXT_PUBLIC_QUERY_RETRY: "1"
  environment:
    name: production/lend360-site
  rules: *deploy_tenant_rules_lend360

deploy:toplend:
  <<: *deploy_template
  variables:
    IMAGE_NAME: lend-site-toplend
    CONTAINER_NAME: lend-site-toplend
    DEPLOY_HOST_PORT: "3003"
    NEXT_PUBLIC_API_BASE_URL: "$LEND_API_URL"
    NEXT_PUBLIC_API_REPORT_URL: "$LEND_REPORT_URL"
    NEXT_PUBLIC_AUTH_API_URL: "$LEND_AUTH_URL"
    NEXT_PUBLIC_QUERY_GC_TIME: "300000"
    NEXT_PUBLIC_QUERY_STALE_TIME: "60000"
    NEXT_PUBLIC_QUERY_RETRY: "1"
  environment:
    name: production/toplend-site
  rules: *deploy_tenant_rules_toplend

deploy:lend365:
  <<: *deploy_template
  variables:
    IMAGE_NAME: lend-site-lend365
    CONTAINER_NAME: lend-site-lend365
    DEPLOY_HOST_PORT: "3004"
    NEXT_PUBLIC_API_BASE_URL: "$LEND_API_URL"
    NEXT_PUBLIC_API_REPORT_URL: "$LEND_REPORT_URL"
    NEXT_PUBLIC_AUTH_API_URL: "$LEND_AUTH_URL"
    NEXT_PUBLIC_QUERY_GC_TIME: "300000"
    NEXT_PUBLIC_QUERY_STALE_TIME: "60000"
    NEXT_PUBLIC_QUERY_RETRY: "1"
  environment:
    name: production/lend365-site
  when: manual
  allow_failure: false
  rules: *deploy_tenant_rules_lend365

.deploy_karalend_compose: &deploy_karalend_compose
  stage: deploy
  tags:
    - karalend
  script:
    - docker version
    - docker compose -p "${COMPOSE_PROJECT_NAME}" -f docker-compose.yml -f docker-compose.karalend.yml build
    - docker compose -p "${COMPOSE_PROJECT_NAME}" -f docker-compose.yml -f docker-compose.karalend.yml up -d
    - docker image prune -f
    - docker builder prune -f

deploy:karalend:
  <<: *deploy_karalend_compose
  variables:
    COMPOSE_PROJECT_NAME: lend-site-v2
    PORT: "14000"
    NEXT_PUBLIC_API_BASE_URL: "$LEND_API_URL"
    NEXT_PUBLIC_API_REPORT_URL: "$LEND_REPORT_URL"
    NEXT_PUBLIC_AUTH_API_URL: "$LEND_AUTH_URL"
    NEXT_PUBLIC_QUERY_GC_TIME: "300000"
    NEXT_PUBLIC_QUERY_STALE_TIME: "60000"
    NEXT_PUBLIC_QUERY_RETRY: "1"
  environment:
    name: production/karalend-site
  rules:
    - if: '$CI_COMMIT_TAG =~ /^karalend-v\d+\.\d+\.\d+$/'
