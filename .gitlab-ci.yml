
stages:
  - deploy

variables:
  IMAGE_NAME: lend-site-v2
  CONTAINER_NAME: lend-site-v2
  DEPLOY_HOST_PORT: "3000"
  CONTAINER_PORT: "3000"
  NEXT_PUBLIC_API_BASE_URL: "https://lendapitest.persiansys.ir/api/v1"
  NEXT_PUBLIC_API_REPORT_URL: "https://lendreporttest.persiansys.ir/api/v1"
  NEXT_PUBLIC_QUERY_GC_TIME: "0"
  NEXT_PUBLIC_QUERY_STALE_TIME: "0"
  NEXT_PUBLIC_QUERY_RETRY: "1"

default:
  interruptible: true
  tags:
    - shell

variables:
  CONTAINER_PORT: "3000"

.deploy_template: &deploy_template
  stage: deploy
  script:
    - docker version
    - |
      docker build \
        --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
        --build-arg NEXT_PUBLIC_API_REPORT_URL="$NEXT_PUBLIC_API_REPORT_URL" \
        --build-arg NEXT_PUBLIC_QUERY_GC_TIME="$NEXT_PUBLIC_QUERY_GC_TIME" \
        --build-arg NEXT_PUBLIC_QUERY_STALE_TIME="$NEXT_PUBLIC_QUERY_STALE_TIME" \
        --build-arg NEXT_PUBLIC_QUERY_RETRY="$NEXT_PUBLIC_QUERY_RETRY" \
        -t "$IMAGE_NAME:latest" \
        .
    - docker stop "$CONTAINER_NAME" || true
    - docker rm "$CONTAINER_NAME" || true
    - |
      docker run -d \
        --name "$CONTAINER_NAME" \
        --restart always \
        -p "${DEPLOY_HOST_PORT}:${CONTAINER_PORT}" \
        -e NODE_ENV=production \
        -e PORT=3000 \
        -e HOSTNAME=0.0.0.0 \
        -e NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
        -e NEXT_PUBLIC_API_REPORT_URL="$NEXT_PUBLIC_API_REPORT_URL" \
        -e NEXT_PUBLIC_QUERY_GC_TIME="$NEXT_PUBLIC_QUERY_GC_TIME" \
        -e NEXT_PUBLIC_QUERY_STALE_TIME="$NEXT_PUBLIC_QUERY_STALE_TIME" \
        -e NEXT_PUBLIC_QUERY_RETRY="$NEXT_PUBLIC_QUERY_RETRY" \
        "$IMAGE_NAME:latest"
    - docker image prune -f


deploy:default-main:
  <<: *deploy_template
  variables:
    IMAGE_NAME: lend-site-v2
    CONTAINER_NAME: lend-site-v2
    DEPLOY_HOST_PORT: "3000"
    NEXT_PUBLIC_API_BASE_URL: "https://lendapitest.persiansys.ir/api/v1"
    NEXT_PUBLIC_QUERY_GC_TIME: "0"
    NEXT_PUBLIC_QUERY_STALE_TIME: "0"
    NEXT_PUBLIC_QUERY_RETRY: "1"
  environment:
    name: production
    url: https://lend.persiansys.ir
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


deploy:lianlend:
  <<: *deploy_template
  variables:
    IMAGE_NAME: lend-site-lianlend
    CONTAINER_NAME: lend-site-lianlend
    DEPLOY_HOST_PORT: "3001"
    NEXT_PUBLIC_API_BASE_URL: "https://api.mylianpay.com/api/v1"
    NEXT_PUBLIC_QUERY_GC_TIME: "300000"
    NEXT_PUBLIC_QUERY_STALE_TIME: "60000"
    NEXT_PUBLIC_QUERY_RETRY: "1"
  environment:
    name: production/lianlend-site
  rules:
    - if: '$CI_COMMIT_TAG =~ /^lianlend-v\d+\.\d+\.\d+$/'

deploy:lend360:
  <<: *deploy_template
  variables:
    IMAGE_NAME: lend-site-lend360
    CONTAINER_NAME: lend-site-lend360
    DEPLOY_HOST_PORT: "3002"
    NEXT_PUBLIC_API_BASE_URL: "https://api.lend360.ir/api/v1"
    NEXT_PUBLIC_QUERY_GC_TIME: "300000"
    NEXT_PUBLIC_QUERY_STALE_TIME: "60000"
    NEXT_PUBLIC_QUERY_RETRY: "1"
  environment:
    name: production/lend360-site
  rules:
    - if: '$CI_COMMIT_TAG =~ /^lend360-v\d+\.\d+\.\d+$/'

deploy:toplend:
  <<: *deploy_template
  variables:
    IMAGE_NAME: lend-site-toplend
    CONTAINER_NAME: lend-site-toplend
    DEPLOY_HOST_PORT: "3003"
    NEXT_PUBLIC_API_BASE_URL: "https://lendapitest.persiansys.ir/api/v1"
    NEXT_PUBLIC_QUERY_GC_TIME: "300000"
    NEXT_PUBLIC_QUERY_STALE_TIME: "60000"
    NEXT_PUBLIC_QUERY_RETRY: "1"
  environment:
    name: production/toplend-site
  rules:
    - if: '$CI_COMMIT_TAG =~ /^toplend-v\d+\.\d+\.\d+$/'

deploy:lend365:
  <<: *deploy_template
  variables:
    IMAGE_NAME: lend-site-lend365
    CONTAINER_NAME: lend-site-lend365
    DEPLOY_HOST_PORT: "3004"
    NEXT_PUBLIC_API_BASE_URL: "https://lendapitest.persiansys.ir/api/v1"
    NEXT_PUBLIC_QUERY_GC_TIME: "300000"
    NEXT_PUBLIC_QUERY_STALE_TIME: "60000"
    NEXT_PUBLIC_QUERY_RETRY: "1"
  environment:
    name: production/lend365-site
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^lend365-v\d+\.\d+\.\d+$/'
