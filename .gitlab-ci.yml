    TCI_LENDTECH_SECRET: "EgPmxDvkadEfFfMVy3n4bqnTnmpMEa_Xq8qee0Hup0k2hdm9IHz34j4QDcQN63in"
    TCI_LENDTECH_LOGIN_URL: "https://my2-test.tci.ir/api/v1/auth/lendtech/login"
